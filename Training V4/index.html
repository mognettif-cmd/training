<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Training</title>
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#0b0d12; --surface:#141822; --card:#1b2030; --line:#2a3044;
  --text:#e7ebf3; --muted:#8b94ad; --accent:#2fbf8f; --on-accent:#06251b;
  --warn:#e0a33c; --bad:#e0645c; --nav:rgba(11,13,18,.96);
  --c-lauf:#5aa6e8; --c-kraft:#a990ec; --c-beweg:#e08bb0; --c-hm:#7fb8a4;
  --c-locker:#2fbf8f; --c-mittel:#e0a33c; --c-hart:#e0645c;
  --t-lauf:#8fc3f0; --t-lauf-b:#2d5f8a; --t-kraft:#c3aef5; --t-kraft-b:#5e4a86;
  --t-beweg:#f0b4cd; --t-beweg-b:#7d4560; --t-velo:#8fd6b4; --t-velo-b:#3f5a4a;
  --r:12px; color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#eef1f5; --surface:#f7f9fb; --card:#ffffff; --line:#d7dde6;
    --text:#151a24; --muted:#5b6476; --accent:#14845f; --on-accent:#ffffff;
    --warn:#a8680c; --bad:#b83a32; --nav:rgba(255,255,255,.96);
    --c-lauf:#2f7fc4; --c-kraft:#7b5fd0; --c-beweg:#c2547f; --c-hm:#3f8f74;
    --c-locker:#1c9a6e; --c-mittel:#d08a1c; --c-hart:#c9463d;
    --t-lauf:#1f5f99; --t-lauf-b:#9cc4e6; --t-kraft:#5b3fb0; --t-kraft-b:#c5b6ee;
    --t-beweg:#9a3561; --t-beweg-b:#e8b5ca; --t-velo:#2d6f52; --t-velo-b:#a9d7c1;
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:78px;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
body.sheet-offen{overflow:hidden}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{padding:18px 16px 10px;max-width:720px;margin:0 auto;position:relative}
.kopfbtn{position:absolute;right:12px;top:14px;background:var(--card);border:1px solid var(--line);
  color:var(--muted);border-radius:10px;padding:6px 11px;font-size:.8rem;cursor:pointer}
.kopfbtn.on{color:var(--accent);border-color:var(--accent)}
.eyebrow{font-size:.78rem;color:var(--muted)}
h1{font-size:1.5rem;margin:2px 0 2px;font-weight:650}
.sub{color:var(--muted);font-size:.88rem;margin:0;padding-right:70px}
h2{font-size:1.15rem;margin:0;font-weight:650}
h3{font-size:1rem;margin:0 0 6px;font-weight:650}
h3.bt{font-size:.82rem;color:var(--muted);font-weight:600;margin:16px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.now{border-color:var(--accent)}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.muted{color:var(--muted)} .akz{color:var(--accent)}
.small{font-size:.85rem} .tiny{font-size:.76rem} .d-block{display:block}
.tag{display:inline-block;font-size:.68rem;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);vertical-align:1px}
.tag.lauf{border-color:var(--t-lauf-b);color:var(--t-lauf)}
.tag.kraft{border-color:var(--t-kraft-b);color:var(--t-kraft)}
.tag.beweg{border-color:var(--t-beweg-b);color:var(--t-beweg)}
.tag.velo{border-color:var(--t-velo-b);color:var(--t-velo)}
.tag.wk{border-color:var(--accent);color:var(--accent)}
.tag.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.day{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.dw{flex:0 0 46px;color:var(--muted);font-size:.8rem;padding-top:2px}
.day.heute .dw{color:var(--accent);font-weight:700}
.tt{font-weight:600}
.blk{padding:8px 0 8px 10px;border-left:3px solid var(--line);margin-top:8px}
.blk.jetzt{border-left-color:var(--accent)}
.blk.vorbei{opacity:.5}
.check{margin-left:auto;flex:0 0 auto;color:var(--accent);font-size:1rem}
button,select,input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 13px;font-size:.88rem;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.gefahr{border-color:var(--bad);color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:.78rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.link{background:none;border:0;color:var(--accent);font-size:.82rem;padding:4px 0;cursor:pointer}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-top:1px solid var(--line);display:flex;z-index:20;
  padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 2px 11px;font-size:.7rem;cursor:pointer}
nav button .ic{display:block;font-size:1.15rem;line-height:1.3}
nav button.on{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.76rem}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--accent);color:var(--on-accent);
  padding:10px 16px;border-radius:99px;font-size:.86rem;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.ue{padding:8px 0;border-top:1px dotted var(--line)}
.hint{color:var(--muted);font-size:.84rem;margin-top:6px}
/* Journal */
.addrow{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;margin-bottom:12px}
.addrow .btn{padding:12px 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:99px;padding:6px 12px;font-size:.82rem;cursor:pointer}
.chip.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.chip:disabled{opacity:.45}
.wkopf{margin-bottom:2px}
.eintrag{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;cursor:pointer}
.wkopf + .eintrag{border-top:0}
/* Bogen */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:720px;margin:0 auto;padding:16px 16px 120px}
.sheet-kopf{position:sticky;top:0;background:var(--bg);padding:6px 0 12px;z-index:2;display:flex;justify-content:space-between;align-items:center}
.rpe{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.rpe button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 0;font-size:.9rem;cursor:pointer;font-variant-numeric:tabular-nums}
.rpe button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.rpe-leg{margin:5px 0 12px}
.ueb{border-top:1px solid var(--line);padding:10px 0 4px}
.satz{display:grid;grid-template-columns:18px 1fr 30px 1fr 34px 44px;gap:5px;align-items:center;margin-top:6px}
.satz input{margin:0;padding:8px;text-align:right;font-variant-numeric:tabular-nums}
.satz .nr{color:var(--muted);font-size:.78rem}
.satz .u{color:var(--muted);font-size:.74rem}
.satz .leer{grid-column:span 2}
.ok{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:1rem;cursor:pointer}
.ok.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
/* Statistik */
.blockwochen{margin-bottom:12px}
.blockwochen > summary{padding:10px 2px;font-size:.95rem;color:var(--text)}
.warum summary{font-size:.76rem;margin:4px 0 2px;color:var(--accent)}
.chart{width:100%;height:auto;display:block;margin-top:4px}
.chart text{fill:var(--muted);font-size:9px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ref{stroke:var(--text);stroke-width:2;opacity:.7}
.chart .lin{fill:none;stroke-width:2}
.chart .trend{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3}
.legende{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.legende span{font-size:.76rem;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:5px}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--surface);margin-top:4px}
.stack i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.72rem;color:#fff;font-weight:600}
.hw{margin:0;padding-left:1.1em;font-size:.86rem}
.hw li{margin-bottom:6px}
.kal{display:grid;gap:3px}
.kal i{aspect-ratio:1;border-radius:3px;background:var(--surface);max-height:22px}
.kal i.zukunft{opacity:.35}
.kal-wt{font-size:.66rem;color:var(--muted);line-height:1}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem;margin-bottom:8px}
/* V4: Durchführung, Skills, Tests */
.ueb.skip{padding-bottom:8px}
.ueb [data-alle]{white-space:nowrap;flex:0 0 auto}
.vors{color:var(--accent);margin-top:3px}
.bew{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bew button{background:none;border:0;color:var(--muted);font-size:.74rem;padding:5px 10px;cursor:pointer}
.bew button + button{border-left:1px solid var(--line)}
.bew button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.pausebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:50;
  display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--accent);border-radius:99px;padding:8px 10px 8px 18px;
  box-shadow:0 6px 24px rgba(0,0,0,.35)}
.pausebar span{color:var(--muted);font-size:.8rem}
.pausebar b{font-size:1.6rem;font-variant-numeric:tabular-nums;min-width:3.2ch;text-align:center;color:var(--accent)}
.fort{height:6px;border-radius:99px;background:var(--surface);overflow:hidden;margin:5px 0 3px}
.fort i{display:block;height:100%;background:var(--accent);border-radius:99px}
.wahl{display:flex;gap:10px;align-items:flex-start;color:var(--text);font-size:.88rem;padding:8px 0;border-top:1px solid var(--line);margin:0;cursor:pointer}
.wahl input{width:18px;height:18px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--accent)}
.radar{width:100%;max-width:380px;height:auto;display:block;margin:6px auto 0}
.radar text{fill:var(--muted);font-size:10px}
.radar .ring{fill:none;stroke:var(--line)}
.radar .ax{stroke:var(--line)}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>

<header>
  <div class="eyebrow" id="hEyebrow">Training</div>
  <h1 id="hTitel">Training</h1>
  <p class="sub" id="hSub"></p>
  <button class="kopfbtn" id="datenBtn">Daten</button>
</header>

<div class="wrap">
  <section id="t-heute"></section>
  <section id="t-plan" hidden></section>
  <section id="t-journal" hidden></section>
  <section id="t-kraft" hidden></section>
  <section id="t-statistik" hidden></section>
  <section id="t-theorie" hidden></section>
  <section id="t-daten" hidden></section>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="sheet-in">
    <div class="sheet-kopf"><h2 id="shT"></h2><button class="btn sm" id="shX">Schliessen</button></div>
    <div id="shB"></div>
  </div>
</div>

<nav>
  <button data-tab="heute"><span class="ic">●</span>Heute</button>
  <button data-tab="plan"><span class="ic">▤</span>Plan</button>
  <button data-tab="journal"><span class="ic">✎</span>Journal</button>
  <button data-tab="kraft"><span class="ic">▦</span>Kraft</button>
  <button data-tab="statistik"><span class="ic">◈</span>Statistik</button>
  <button data-tab="theorie"><span class="ic">✦</span>Theorie</button>
</nav>

<div class="toast" id="toast" role="status"></div>

<script src="./theorie.js"></script>
<script>
/* ════════════════ Speicher ════════════════ */
var K = {
  plaene:'tp_plaene_v1', aktiv:'tp_plan_aktiv_v1', runs:'tp_runs_v1',
  kraftlog:'tp_kraftlog_v1', sessions:'tp_sessions_v1', sessver:'tp_sessions_ver',
  journal:'tp_journal_v1', tab:'tp_tab', zr:'tp_stat_zeitraum', filter:'tp_journal_filter', uebung:'tp_stat_uebung',
  stufen:'tp_stufen_v1', tests:'tp_tests_v1', variante:'tp_variante'
};
var ram = {};
function load(k, fb){
  try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; }
  catch(e){ return (k in ram) ? ram[k] : fb; }
}
function save(k, v){
  ram[k] = v;
  try { localStorage.setItem(k, JSON.stringify(v)); }
  catch(e){ toast('Speichern lokal blockiert'); }
}

/* ════════════════ Hilfen ════════════════ */
var WT = ['Mo','Di','Mi','Do','Fr','Sa','So'];
function pad(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function heute(){ return iso(new Date()); }
function plusTage(isoStr, n){ var d = new Date(isoStr+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function montag(isoStr){ var d = new Date(isoStr+'T12:00:00'); var w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return iso(d); }
function wtag(isoStr){ return (new Date(isoStr+'T12:00:00').getDay()+6)%7; }
function deDatum(isoStr){ var p = String(isoStr).split('-'); return p.length===3 ? p[2]+'.'+p[1]+'.' : isoStr; }
function tageBis(isoStr){
  var a = new Date(heute()+'T12:00:00'), b = new Date(isoStr+'T12:00:00');
  return Math.round((b-a)/86400000);
}
function zahl(txt){ var n = parseFloat(String(txt==null?'':txt).replace(',','.')); return isNaN(n) ? null : n; }
function parseZeit(txt){
  if (!txt) return null;
  var p = String(txt).trim().split(':').map(function(x){ return parseFloat(x.replace(',','.'))||0; });
  if (p.length===3) return p[0]*3600+p[1]*60+p[2];
  if (p.length===2) return p[0]*60+p[1];
  return p[0] ? p[0]*60 : null;          /* reine Zahl = Minuten */
}
function zeitStr(sek){
  if (!sek) return '–';
  sek = Math.round(sek);
  var h = Math.floor(sek/3600), m = Math.floor(sek%3600/60), s = sek%60;
  return h ? h+':'+pad(m)+':'+pad(s) : m+':'+pad(s);
}
function paceStr(sek, km){
  if (!sek || !km) return '–';
  var p = sek/km; return Math.floor(p/60)+':'+pad(Math.round(p%60)%60);
}
function f1(x){ return (Math.round(x*10)/10).toString(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(txt){
  var t = document.getElementById('toast'); t.textContent = txt; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

/* Journal: ein Eintrag pro Training.
   { id, datum, typ:'lauf'|'kraft'|'beweg', sek, rpe, notiz,
     lauf:  km, hm, hf
     kraft: session, titel, uebungen:[{id,name,art,saetze:[{kg,n}]}] } */
function ausAltdaten(runs, logs){
  var j = [];
  (runs||[]).forEach(function(r){
    if (!r || !r.datum) return;
    j.push({ id:r.id||uid(), datum:r.datum, typ:'lauf', km:r.km||null, sek:r.zeit||null,
      hm:r.hm||null, hf:r.hf||null, rpe:null, notiz:r.notiz||'' });
  });
  (logs||[]).forEach(function(l){
    if (!l || !l.datum) return;
    j.push({ id:l.id||uid(), datum:l.datum, typ:'kraft', session:l.session, titel:l.name,
      sek:null, rpe:null, uebungen:[],
      notiz:[l.notiz, l.total ? l.erledigt+'/'+l.total+' Übungen' : ''].filter(Boolean).join(' · ') });
  });
  return j;
}
var journal = load(K.journal, null);
if (!journal){ journal = ausAltdaten(load(K.runs, []), load(K.kraftlog, [])); save(K.journal, journal); }

var stufen = load(K.stufen, {});
function leiter(id){ return LEITERN.filter(function(l){ return l.id===id; })[0]; }
function stufeNr(id){ var l = leiter(id), s = stufen[id] || 1; return Math.max(1, Math.min(s, l.stufen.length)); }
function stufeVon(id){ return leiter(id).stufen[stufeNr(id)-1]; }
/* Eintrags-ID pro Stufe, damit der Kraftverlauf die Stufen nicht vermischt */
function uebId(u){ return u.leiter ? u.id+'@'+stufeNr(u.leiter) : u.id; }
function uebName(u){ return u.leiter ? u.name.replace(' (Stufe)','')+': '+stufeVon(u.leiter).name : u.name; }
function uebArt(u){ return u.leiter ? stufeVon(u.leiter).art : u.art; }
function uebDosis(u, variante){
  var d = (variante==='kurz' && u.kurzDosis) ? u.kurzDosis : u.dosis;
  return u.leiter ? d.replace('Stufenziel', stufeVon(u.leiter).ziel) : d;
}
/* Bereit für die nächste Stufe? Zwei Einheiten in Folge mit allen Sätzen ≥ Ziel */
function leiterBereit(id){
  var l = leiter(id), nr = stufeNr(id), st = l.stufen[nr-1];
  if (nr >= l.stufen.length) return false;
  var treffer = [];
  journal.filter(function(e){ return e.typ==='kraft'; }).sort(function(a,b){ return a.datum < b.datum ? 1 : -1; })
    .forEach(function(e){ (e.uebungen||[]).forEach(function(u){ if (u.leiter===id) treffer.push({ e:e, u:u }); }); });
  if (treffer.length < 2) return false;
  return treffer.slice(0,2).every(function(t){
    return t.u.stufe===nr && t.u.saetze.length >= 2 && t.u.bew!=='hart' &&
      t.u.saetze.every(function(s){ return (s.n||0) >= st.n; });
  });
}

function renderKopf(){
  var p = plan(), wk = { name:p.wettkampf.name, datum:p.wettkampf.datum };
  /* Bei Saisonplänen: nächster Wettkampf aus den Blöcken */
  (p.bloecke||[]).filter(function(b){ return b.wkDatum && b.wkDatum >= heute(); })
    .sort(function(a,b){ return a.wkDatum < b.wkDatum ? -1 : 1; }).slice(0,1)
    .forEach(function(b){ wk = { name:b.wkName||b.name, datum:b.wkDatum }; });
  var d = tageBis(wk.datum);
  document.getElementById('hEyebrow').textContent =
    wk.name + ', ' + deDatum(wk.datum) + String(wk.datum).slice(0,4);

/* ════════════════ Tab Plan ════════════════ */
function erledigtAm(datum, typ){
  return journal.some(function(e){ return e.datum===datum && e.typ===typ; });
}
function planTag(datum){
  var p = plan(), treffer = null;
  (p.wochen||[]).forEach(function(w){
    var i = Math.round((new Date(datum+'T12:00:00') - new Date(w.start+'T12:00:00'))/86400000);
    if (i>=0 && i<7 && w.tage && w.tage[i]) treffer = w.tage[i];
  });
  return treffer;
}
function renderPlan(){
  var p = plan(), h = '';
  if (plaene.length > 1){
    h += '<div class="card"><label for="planWahl">Aktiver Plan</label><select id="planWahl" style="margin:0">';
    plaene.forEach(function(x){
      h += '<option value="'+esc(x.id)+'"'+(x.id===p.id?' selected':'')+'>'+esc(x.name)+'</option>';
    });
    h += '</select></div>';
  }
  if (p.bloecke && p.bloecke.length){
    h += '<div class="card"><h3>Saison</h3>';
    p.bloecke.forEach(function(b){
      var jetzt = heute() >= b.von && heute() <= b.bis, vorbei = heute() > b.bis;
      h += '<div class="blk'+(jetzt?' jetzt':'')+(vorbei?' vorbei':'')+'">'+
           '<div class="between"><strong class="small">'+esc(b.name)+(jetzt?' (jetzt)':'')+'</strong>'+

           (b.erhaltung ? '<div class="tiny muted">Erhaltung: '+esc(b.erhaltung)+'</div>' : '')+
           (b.wettkampf ? '<div class="tiny akz">Wettkampf: '+esc(b.wettkampf)+'</div>' : '')+
           (b.warum ? '<details class="warum"><summary>Warum jetzt?</summary><div class="small">'+esc(b.warum)+'</div></details>' : '')+'</div>';
    });
    h += '</div>';
  }
  h += '<div class="card"><div class="between"><h3>Tempi</h3><span class="tiny muted">min/km</span></div><table>';
  Object.keys(p.tempi || {}).forEach(function(k){
    h += '<tr><td>'+esc(k)+'</td><td class="num">'+esc(p.tempi[k])+'</td></tr>';
  });
  h += '</table></div>';
  var gruppen = [];
  if (p.bloecke && p.bloecke.length){
    p.bloecke.forEach(function(b){ gruppen.push({ b:b, w:(p.wochen||[]).filter(function(w){ return w.start >= b.von && w.start <= b.bis; }) }); });
  } else gruppen.push({ b:null, w:p.wochen||[] });
  /* Offen: laufender Block; vor Saisonstart der erste */
  var offenIdx = gruppen.map(function(g){ return g.b && g.b.von <= heute() && g.b.bis >= heute(); }).indexOf(true);
  if (offenIdx < 0) offenIdx = gruppen.map(function(g){ return !g.b || g.b.von > heute(); }).indexOf(true);
  gruppen.forEach(function(g, gi){
    if (!g.w.length) return;
    if (g.b) h += '<details class="blockwochen"'+(gi===offenIdx?' open':'')+'><summary><strong>'+esc(g.b.name)+'</strong> <span class="tiny muted">'+
      deDatum(g.b.von)+'–'+deDatum(g.b.bis)+' · '+g.w.length+' Wochen</span></summary>';
    g.w.forEach(wocheKarte);
    if (g.b) h += '</details>';
  });
  function wocheKarte(w){
    var ende = plusTage(w.start, 6), jetzt = heute() >= w.start && heute() <= ende;
    h += '<div class="card'+(jetzt?' now':'')+'">';
    h += '<div class="between"><h3>Woche '+w.nr+(jetzt?' (jetzt)':'')+'</h3>'+
         '<span class="tiny muted">'+deDatum(w.start)+'–'+deDatum(ende)+'</span></div>';
    if (w.fokus) h += '<p class="small muted" style="margin:0 0 8px">'+esc(w.fokus)+'</p>';
    (w.tage || []).forEach(function(t, i){
      var datum = plusTage(w.start, i), ist = datum === heute();
      var ok = erledigtAm(datum, t.typ), wk = t.wk || (t.km && t.km > 20);
      h += '<div class="day'+(ist?' heute':'')+'">';
      h += '<div class="dw">'+WT[i]+' '+deDatum(datum).slice(0,3)+'</div><div style="flex:1">';
      h += '<div class="tt">'+esc(t.titel)+' <span class="tag '+(wk?'wk':t.typ)+'">'+(wk?'Wettkampf':t.typ)+'</span></div>';
      if (t.detail) h += '<div class="small muted">'+esc(t.detail)+'</div>';
      if (t.km) h += '<div class="tiny muted">ca. '+t.km+' km</div>';
      h += '</div>';
      if (ok) h += '<div class="check" aria-label="erledigt">✓</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  if (p.regeln && p.regeln.length){
    h += '<div class="card"><h3>Regeln</h3><ul class="small" style="margin:0;padding-left:1.1em">';
    p.regeln.forEach(function(r){ h += '<li style="margin-bottom:5px">'+esc(r)+'</li>'; });
    h += '</ul></div>';
  }
  document.getElementById('t-plan').innerHTML = h;
  var sel = document.getElementById('planWahl');
  if (sel) sel.onchange = function(){ aktivId = sel.value; save(K.aktiv, aktivId); renderKopf(); renderPlan(); };
  renderKopf();
}

function eintragZeile(e){
  var t = '', s = [];
  if (e.typ==='lauf'){
    t = (e.km ? f1(e.km)+' km' : 'Lauf');
    if (e.sek) s.push(zeitStr(e.sek));
    if (e.sek && e.km) s.push(paceStr(e.sek, e.km)+'/km');
    if (e.hm) s.push(e.hm+' Hm');
    if (e.hf) s.push('HF '+e.hf);
  } else if (e.typ==='kraft'){
    var se = sessionVon(e.session);
    t = e.titel || (se ? se.name : 'Kraft');
    var n = (e.uebungen||[]).reduce(function(a,u){ return a + u.saetze.length; }, 0);
    if (n) s.push(n+' Sätze');
    if (e.sek) s.push(Math.round(e.sek/60)+' Min');
  } else {
    t = 'Beweglichkeit';
    if (e.sek) s.push(Math.round(e.sek/60)+' Min');
  }
  if (e.rpe!=null) s.push('RPE '+e.rpe);
  return { titel:t, sub:s.join(' · ') };
}

/* Letzte Einträge einer Übung (für Vorbelegung und Progressionsvorschlag) */
function letzteUebung(uid_, ausser){
  var best = null;
  journal.forEach(function(x){
    if (x.typ!=='kraft' || x.id===ausser) return;
    (x.uebungen||[]).forEach(function(u){
      if (u.id===uid_ && u.saetze.length && (!best || x.datum > best.d)) best = { d:x.datum, u:u };
    });
  });
  return best;
}
function letzteSaetze(uid_, ausser){ var b = letzteUebung(uid_, ausser); return b ? b.u.saetze : null; }
function satzZahl(dosis){ var m = /^(\d+)\s*×/.exec(dosis||''); return m ? parseInt(m[1],10) : 1; }

/* Progression nach der Bewertung vom letzten Mal (Autoregulation, vgl. Hickmott et al. 2022) */
function vorschlag(u, art, letzte){
  if (!letzte || !letzte.u.bew) return { text:'', saetze:null };
  var bew = letzte.u.bew, alt = letzte.u.saetze, mitKg = alt.some(function(s){ return s.kg; });
  var plus = (art==='kg' || (art==='bw' && mitKg) || art==='kgm');
  var neu = alt.map(function(s){ return { kg:s.kg, n:s.n }; });
  var text;
  if (bew==='leicht'){
    if (plus){ neu.forEach(function(s){ if (s.kg!=null) s.kg = Math.round((s.kg + 2.5)*10)/10; }); text = 'Letztes Mal leicht → heute +2,5 kg.'; }
    else if (art==='sek'){ neu.forEach(function(s){ if (s.n!=null) s.n += 3; }); text = 'Letztes Mal leicht → heute +3 s.'; }
    else { neu.forEach(function(s){ if (s.n!=null) s.n += 1; }); text = 'Letztes Mal leicht → heute +1 Wdh.'; }
  } else if (bew==='passend'){ text = 'Letztes Mal passend → gleiche Werte, saubere Ausführung.'; }
  else { text = 'Letztes Mal hart → Last halten, erst steigern, wenn es passend wird.'; }
  return { text:text, saetze:neu };
}

/* ── Pausentimer und Einheiten-Uhr ── */
var kraftStart = null, pauseH = null, wakeLock = null;
function wachHalten(an){
  try {
    if (an && 'wakeLock' in navigator && !wakeLock) navigator.wakeLock.request('screen').then(function(w){ wakeLock = w; }).catch(function(){});
    if (!an && wakeLock){ wakeLock.release().catch(function(){}); wakeLock = null; }
  } catch(e){}
}
function pauseStart(sek){
  var bar = document.getElementById('pauseBar'); if (!bar || !sek) return;
  clearInterval(pauseH);
  var ende = Date.now() + sek*1000;
  bar.hidden = false;
  function tick(){
    var rest = Math.round((ende - Date.now())/1000);
    if (rest <= 0){
      clearInterval(pauseH); bar.querySelector('b').textContent = 'Los!';
      try { navigator.vibrate && navigator.vibrate([200,100,200]); } catch(e){}
      setTimeout(function(){ bar.hidden = true; }, 2500); return;
    }
    if (rest === 10){ try { navigator.vibrate && navigator.vibrate(80); } catch(e){} }
    bar.querySelector('b').textContent = Math.floor(rest/60)+':'+pad(rest%60);
  }
  tick(); pauseH = setInterval(tick, 250);
}
function pauseStop(){ clearInterval(pauseH); var bar = document.getElementById('pauseBar'); if (bar) bar.hidden = true; }

function formKraft(e, sidVorgabe, varVorgabe){
  var sid = e ? e.session : (sidVorgabe || naechsteSession());
  var s = sessionVon(sid) || sessions[0];
  var variante = e ? (e.variante||'normal') : (varVorgabe || load(K.variante, 'normal'));
  if (kraftStart && Date.now()-kraftStart > 3*3600000) kraftStart = null;
  if (!e && !kraftStart) kraftStart = Date.now();
  var h = kopfFelder(e);
  h += '<label>Einheit</label><div class="chips" style="margin-bottom:8px">';
  sessions.forEach(function(x){
    h += '<button type="button" class="chip'+(x.id===s.id?' on':'')+'" data-ses="'+esc(x.id)+'"'+(e?' disabled':'')+'>'+esc(x.name.split(' – ')[0])+'</button>';
  });
  h += '</div><label>Version</label><div class="chips" style="margin-bottom:10px">';
  [['kurz','Kurz'],['normal','Normal']].forEach(function(v){
    var min = s.dauer ? s.dauer[v[0]] : null;
    h += '<button type="button" class="chip'+(variante===v[0]?' on':'')+'" data-var="'+v[0]+'"'+(e?' disabled':'')+'>'+v[1]+(min?' ~'+min+'′':'')+'</button>';
  });
  h += '</div>';
  if (s.hinweis) h += '<p class="tiny muted" style="margin:-4px 0 10px">'+esc(s.hinweis)+'</p>';
  h += '<p class="tiny muted" style="margin:0 0 10px">Vorbelegt mit dem Vorschlag aus dem letzten Mal. ✓ startet die Pause. Pro Übung kurz bewerten: daraus kommt der nächste Vorschlag.</p>';
  s.bloecke.forEach(function(b){
    var alle = b.uebungen.filter(function(u){ return variante==='normal' || u.kurz!==false; });
    if (!alle.length) return;
    h += '<h3 class="bt">'+esc(b.titel)+'</h3>';
    alle.forEach(function(u){
      if (u.art==='skip'){
        h += '<div class="ueb skip"><strong class="small">'+esc(u.name)+'</strong><div class="tiny muted">'+esc(uebDosis(u, variante))+(u.hinweis?' · '+esc(u.hinweis):'')+'</div></div>';
        return;
      }
      var id = uebId(u), art = uebArt(u);
      var gespeichert = e ? (e.uebungen||[]).filter(function(x){ return x.id===id || (u.leiter && x.leiter===u.leiter); })[0] : null;
      if (gespeichert){ id = gespeichert.id; art = gespeichert.art; }
      var saetze, done, bew = gespeichert ? gespeichert.bew : null, vtext = '';
      if (gespeichert){ saetze = gespeichert.saetze; done = true; }
      else {
        var letzte = letzteUebung(id, e?e.id:null), vs = vorschlag(u, art, letzte);
        vtext = vs.text;
        saetze = vs.saetze || (letzte ? letzte.u.saetze : []);
        var soll = satzZahl(uebDosis(u, variante));
        saetze = saetze.slice(0, soll);
        while (saetze.length < soll) saetze.push(saetze.length ? { kg:saetze[saetze.length-1].kg, n:saetze[saetze.length-1].n } : {kg:null,n:null});
        done = false;
      }
      var ein = EINHEIT[art] || ['kg','Wdh'];
      var st = u.leiter ? stufeVon(u.leiter) : null;

var FARBE = { lauf:'var(--c-lauf)', kraft:'var(--c-kraft)', beweg:'var(--c-beweg)' };

function zeitraum(){
  var art = load(K.zr, 'block'), p = plan(), t = heute(), von, bis = t, name, notiz = '';
  if (art === 'block' && p.bloecke && p.bloecke.length){
    var b = p.bloecke.filter(function(x){ return x.von <= t && x.bis >= t; })[0] ||
            p.bloecke.filter(function(x){ return x.von <= t; }).slice(-1)[0];
    if (b){ von = b.von; bis = b.bis < t ? b.bis : t; name = b.name; }
    else notiz = 'Der erste Block hat noch nicht begonnen – gezeigt werden die letzten 4 Wochen.';
  }
  if (art === 'saison'){
    var erste = journal.reduce(function(a,e){ return !a || e.datum < a ? e.datum : a; }, null);
    var bs = p.bloecke && p.bloecke.length ? p.bloecke[0].von : null;
    von = [erste, bs].filter(function(x){ return x && x <= t; }).sort()[0];
    name = 'Saison';
    if (!von){ von = null; notiz = 'Noch keine Daten in der Saison – gezeigt werden die letzten 4 Wochen.'; }
  }
  if (!von){ von = plusTage(montag(t), -21); name = 'Letzte 4 Wochen'; art = art==='4w' ? '4w' : art; }
  var wochen = [];
  for (var m = montag(von); m <= bis; m = plusTage(m, 7)) wochen.push(m);
  return { art:art, von:von, bis:bis, name:name, wochen:wochen, notiz:notiz };
}
function imZeitraum(z){ return journal.filter(function(e){ return e.datum >= z.von && e.datum <= z.bis; }); }
function proWoche(z, fn){ return z.wochen.map(function(m){ var e = plusTage(m,6);
  return fn(journal.filter(function(x){ return x.datum >= m && x.datum <= e && x.datum >= z.von && x.datum <= z.bis; }), m); }); }

/* Monotonie nach Foster: Mittel der 7 Tageslasten / Standardabweichung */
function monotonie(montagIso){
  var tage = []; for (var i=0;i<7;i++){ var d = plusTage(montagIso,i);
    tage.push(journal.filter(function(e){ return e.datum===d; }).reduce(function(a,e){ return a+belastung(e); },0)); }
  var mw = tage.reduce(function(a,b){return a+b;},0)/7;
  var sd = Math.sqrt(tage.reduce(function(a,b){ return a+(b-mw)*(b-mw); },0)/7);
  return { wert: sd ? mw/sd : null, last: mw*7 };
}
/* Laufeffizienz: Meter pro Herzschlag, Höhenmeter als Leistungs-km (100 Hm ≈ 1 km) */
function effizienz(e){
  if (e.typ!=='lauf' || !e.km || !e.sek || !e.hf) return null;
  var lkm = e.km + (e.hm||0)/100;
  return (lkm*1000/(e.sek/60)) / e.hf;
}
/* Kraft-Kennzahl pro Einheit */
function kraftWert(u){
  var s = u.saetze.filter(function(x){ return x.n; });
  if (!s.length) return null;
  if (u.art==='kg'){
    var best = 0;
    s.forEach(function(x){ if (x.kg && x.n <= 12) best = Math.max(best, x.kg*(1+x.n/30)); });
    if (best) return { v:best, lab:'geschätztes Maximum (kg, Epley)' };
    return { v:Math.max.apply(null, s.map(function(x){ return (x.kg||0)*x.n; })), lab:'beste Serie (kg × Wdh)' };
  }
  if (u.art==='bw'){
    var zus = s.some(function(x){ return x.kg; });
    if (zus) return { v:Math.max.apply(null, s.map(function(x){ return (x.kg||0)*(1+x.n/30); })), lab:'Zusatzlast-Maximum (kg, Epley)' };
    return { v:Math.max.apply(null, s.map(function(x){ return x.n; })), lab:'beste Serie (Wdh)' };
  }
  if (u.art==='sek') return { v:Math.max.apply(null, s.map(function(x){ return x.n; })), lab:'längste Haltezeit (s)' };
  if (u.art==='min') return { v:s.reduce(function(a,x){ return a+x.n; },0), lab:'Übungszeit (Min)' };
  if (u.art==='kgm') return { v:s.reduce(function(a,x){ return a+(x.kg||0)*x.n; },0), lab:'Gesamtlast (kg × m)' };
  return null;
}

function skala(max){ if (max <= 0) return 1; var p = Math.pow(10, Math.floor(Math.log10(max))); var n = max/p;
  return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
function achsen(max, einheit){
  var h = '', w = CW-PL;

    h += '<line x1="'+PL+'" x2="'+CW+'" y1="'+y+'" y2="'+y+'" class="gl"/>'+
         '<text x="'+(PL-4)+'" y="'+(y+3)+'" text-anchor="end">'+(Math.round(v*10)/10)+'</text>'; }
  if (einheit) h += '<text x="'+PL+'" y="'+(PT-1)+'">'+esc(einheit)+'</text>';
  return h;
}
function xLabels(labels, x){
  var h = '', n = labels.length, step = Math.ceil(n/7);
  labels.forEach(function(l,i){
    if (!(i%step===0 || i===n-1)) return;
    if (i===n-1 && i%step!==0 && i-Math.floor(i/step)*step < step/2) return;   /* Überlappung vermeiden */
    var anc = (n>1 && i===0 && x(i) < PL+14) ? 'start' : (n>1 && i===n-1 && x(i) > CW-14) ? 'end' : 'middle';
    h += '<text x="'+x(i)+'" y="'+(CH-4)+'" text-anchor="'+anc+'">'+esc(l)+'</text>'; });
  return h;
}
function balken(labels, serien, opt){
  opt = opt || {};
  var n = labels.length; if (!n) return '';
  var summen = labels.map(function(_,i){ return serien.reduce(function(a,s){ return a+(s.werte[i]||0); },0); });
  var max = skala(Math.max.apply(null, summen.concat(opt.ref ? opt.ref.map(function(x){return x||0;}) : [0]).concat([0.0001])));
  var bw = (CW-PL)/n, hgt = CH-PT-PB;
  var x = function(i){ return PL + bw*i + bw/2; };
  var h = '<svg viewBox="0 0 '+CW+' '+CH+'" class="chart" role="img" aria-label="'+esc(opt.titel||'')+'">'+achsen(max, opt.einheit);
  labels.forEach(function(_,i){
    var y0 = PT+hgt;
    serien.forEach(function(s){
      var v = s.werte[i]||0; if (!v) return;
      var hh = hgt*v/max; y0 -= hh;
      h += '<rect x="'+(PL+bw*i+bw*0.18)+'" y="'+y0+'" width="'+(bw*0.64)+'" height="'+hh+'" rx="2" style="fill:'+s.farbe+'"><title>'+esc(labels[i]+': '+f1(v))+'</title></rect>';
    });
    if (opt.ref && opt.ref[i]){ var yr = PT+hgt*(1-opt.ref[i]/max);
      h += '<line x1="'+(PL+bw*i+bw*0.08)+'" x2="'+(PL+bw*i+bw*0.92)+'" y1="'+yr+'" y2="'+yr+'" class="ref"/>'; }
  });
  return h + xLabels(labels, x) + '</svg>';
}
function linie(labels, werte, opt){
  opt = opt || {};
  var pts = werte.map(function(v,i){ return v==null ? null : [i,v]; }).filter(Boolean);
  if (!pts.length) return '';
  var vals = pts.map(function(p){return p[1];});
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi===lo){ hi += 1; lo = Math.max(0, lo-1); }
  var pad_ = (hi-lo)*0.15; lo -= pad_; hi += pad_;
  var n = labels.length, hgt = CH-PT-PB;
  var x = function(i){ return n<2 ? PL+(CW-PL)/2 : PL + (CW-PL-8)*i/(n-1) + 4; };
  var y = function(v){ return PT + hgt*(1-(v-lo)/(hi-lo)); };
  var h = '<svg viewBox="0 0 '+CW+' '+CH+'" class="chart" role="img" aria-label="'+esc(opt.titel||'')+'">';
  for (var g=0; g<=2; g++){ var v = lo+(hi-lo)*g/2, yy = y(v);
    h += '<line x1="'+PL+'" x2="'+CW+'" y1="'+yy+'" y2="'+yy+'" class="gl"/><text x="'+(PL-4)+'" y="'+(yy+3)+'" text-anchor="end">'+(opt.fmt?opt.fmt(v):f1(v))+'</text>'; }
  if (opt.einheit) h += '<text x="'+PL+'" y="'+(PT-1)+'">'+esc(opt.einheit)+'</text>';
  if (opt.mittel && pts.length >= 3){
    var m = pts.map(function(p,k){ var a = pts.slice(Math.max(0,k-2), k+1); return [p[0], a.reduce(function(s,q){return s+q[1];},0)/a.length]; });
    h += '<polyline class="trend" points="'+m.map(function(p){ return x(p[0])+','+y(p[1]); }).join(' ')+'"/>';
  }
  h += '<polyline class="lin" style="stroke:'+(opt.farbe||'var(--accent)')+'" points="'+pts.map(function(p){ return x(p[0])+','+y(p[1]); }).join(' ')+'"/>';
  pts.forEach(function(p){ h += '<circle cx="'+x(p[0])+'" cy="'+y(p[1])+'" r="2.6" style="fill:'+(opt.farbe||'var(--accent)')+'"><title>'+esc(labels[p[0]]+': '+(opt.fmt?opt.fmt(p[1]):f1(p[1])))+'</title></circle>'; });
  return h + xLabels(labels, x) + '</svg>';
}
function legende(items){
  return '<div class="legende">'+items.map(function(i){ return '<span><i class="dot" style="background:'+i[1]+'"></i>'+esc(i[0])+'</span>'; }).join('')+'</div>';
}

function hinweise(z, liste){
  var h = [], p = plan();
  var mono = monotonie(montag(heute()));
  if (mono.wert && mono.wert > 2) h.push('Monotonie diese Woche '+f1(mono.wert)+': die Tage sind sehr gleichförmig belastet. Ein echter Ruhetag oder ein klar leichter Tag senkt sie.');
  var zuHart = liste.filter(function(e){ if (e.typ!=='lauf' || e.rpe==null || e.rpe < 6) return false;
    var t = planTag(e.datum); return t && t.typ==='lauf' && /locker|langer lauf/i.test(t.titel+' '+t.detail) && !/bergsprint|qualität|schwelle|zieltempo|wettkampf/i.test(t.titel+' '+t.detail); });
  if (zuHart.length) h.push(zuHart.length+' als locker geplante'+(zuHart.length>1?' Läufe hatten':'r Lauf hatte')+' RPE 6 oder mehr ('+zuHart.map(function(e){return deDatum(e.datum);}).join(', ')+'). Locker heisst Plaudertempo.');
  var maxKm = proWoche(z, function(l){ return l.filter(function(e){return e.typ==='lauf';}).reduce(function(a,e){ return Math.max(a, e.km||0); },0); });
  for (var i=1;i<maxKm.length;i++){ if (maxKm[i-1] && maxKm[i] - maxKm[i-1] > 2.5)
    h.push('Längster Lauf in der Woche ab '+deDatum(z.wochen[i])+' ist '+f1(maxKm[i]-maxKm[i-1])+' km länger als in der Vorwoche. Richtwert: höchstens 1–2 km pro Woche.'); }
  liste.filter(function(e){ return e.typ==='kraft' && e.session==='kraft-b'; }).forEach(function(e){
    var morgen = plusTage(e.datum, 1);
    var lang = journal.filter(function(x){ return x.typ==='lauf' && x.datum===morgen && (x.km||0) >= 10; })[0];
    if (lang) h.push('Kraft B am '+deDatum(e.datum)+' lag direkt vor dem langen Lauf ('+f1(lang.km)+' km).');
  });
  var lauf = liste.filter(function(e){ return e.typ==='lauf' && e.rpe!=null && e.sek; });
  var mHart = lauf.reduce(function(a,e){ return a + (e.rpe>=5 ? e.sek : 0); },0), mAll = lauf.reduce(function(a,e){ return a+e.sek; },0);
  if (mAll && lauf.length >= 4 && mHart/mAll > 0.3) h.push(Math.round(mHart/mAll*100)+' % der Laufzeit lag bei RPE 5 oder höher. Für Grundausdauer ist das viel; Orientierung sind rund 20 %.');
  var eff = liste.filter(function(e){ return effizienz(e)!=null; }).sort(function(a,b){ return a.datum<b.datum?-1:1; });
  if (eff.length >= 6){
    var dr = Math.floor(eff.length/3), a = eff.slice(0,dr), b = eff.slice(-dr);
    var ma = a.reduce(function(s,e){return s+effizienz(e);},0)/a.length, mb = b.reduce(function(s,e){return s+effizienz(e);},0)/b.length;
    var d = (mb-ma)/ma*100;
    if (Math.abs(d) >= 3) h.push('Laufeffizienz '+(d>0?'+':'')+Math.round(d)+' % (letztes Drittel gegenüber erstem Drittel im Zeitraum)'+(d>0?': die Grundausdauer wächst.':'. Möglich sind Ermüdung, Hitze oder Krankheit.'));
  }
  var ohne = liste.filter(function(e){ return e.rpe==null || !e.sek; }).length;
  if (ohne) h.push(ohne+' Einträge ohne RPE oder Dauer fliessen nicht in die Belastung ein.');
  return h;
}

/* ── Spinnennetz: jede Achse relativ zum besten je erreichten Wert (1 = Bestwert) ── */
function radar(achsen, serien){
  var W = 380, H = 300, cx = W/2, cy = 150, r = 100, n = achsen.length, h = '';
  function pt(i, v){ var a = -Math.PI/2 + 2*Math.PI*i/n; return [cx + Math.cos(a)*r*v, cy + Math.sin(a)*r*v]; }
  h += '<svg viewBox="0 0 '+W+' '+H+'" class="radar" role="img" aria-label="Testbatterie">';
  [0.25,0.5,0.75,1].forEach(function(k){ h += '<polygon class="ring" points="'+achsen.map(function(_,i){ return pt(i,k).join(','); }).join(' ')+'"/>'; });
  achsen.forEach(function(a, i){
    var p = pt(i,1), l = pt(i,1.17), anc = Math.abs(l[0]-cx) < 8 ? 'middle' : (l[0] < cx ? 'end' : 'start');
    h += '<line class="ax" x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'"/>'+
         '<text x="'+l[0]+'" y="'+(l[1]+3)+'" text-anchor="'+anc+'">'+esc(a)+'</text>';
  });
  serien.forEach(function(s){
    h += '<polygon points="'+s.werte.map(function(v,i){ return pt(i, v==null?0:Math.max(0.04,v)).join(','); }).join(' ')+'" style="fill:'+s.farbe+';fill-opacity:'+(s.fill||0.18)+';stroke:'+s.farbe+';stroke-width:2'+(s.dash?';stroke-dasharray:4 3':'')+'"/>';
  });
  return h + '</svg>';
}
function testKarte(){
  var liste = tests.slice().sort(function(a,b){ return a.datum < b.datum ? -1 : 1; });
  var h = '<div class="card"><div class="between"><h3>Testbatterie</h3><button class="btn sm" data-test>+ Test</button></div>';
  if (!liste.length) return h + '<p class="small muted" style="margin:0">Noch kein Test eingetragen. Alle 6 Wochen testen: Oberkörper, Sprungkraft, Spagat und 3 km.</p></div>';
  var akt = liste[liste.length-1], vor = liste.length > 1 ? liste[liste.length-2] : null;
  var achsen = TESTS.filter(function(t){ return liste.some(function(x){ return x.werte[t.id]!=null; }); });
  function norm(t, v){
    if (v==null) return null;
    var alle = liste.map(function(x){ return x.werte[t.id]; }).filter(function(x){ return x!=null; });
    if (t.besser==='hoch'){ var mx = Math.max.apply(null, alle); return mx > 0 ? v/mx : 1; }
    var mn = Math.min.apply(null, alle);           /* tiefer ist besser: Spagat in cm, Laufzeit */
    if (t.einheit==='cm'){ var mxc = Math.max.apply(null, alle) + 5; return (mxc - v)/(mxc - mn || 1); }
    return v > 0 ? mn/v : 1;
  }
  if (achsen.length >= 3){
    var ser = [];
    if (vor) ser.push({ werte:achsen.map(function(t){ return norm(t, vor.werte[t.id]); }), farbe:'var(--muted)', fill:0.06, dash:true });
    ser.push({ werte:achsen.map(function(t){ return norm(t, akt.werte[t.id]); }), farbe:'var(--accent)' });
    h += radar(achsen.map(function(t){ return t.kurz; }), ser) +
         legende([['Test '+deDatum(akt.datum), 'var(--accent)']].concat(vor ? [['Test '+deDatum(vor.datum), 'var(--muted)']] : []))+
         '<p class="tiny muted" style="margin:4px 0 0">Aussen = bester je gemessener Wert. Beim Spagat zählt jeder cm näher am Boden.</p>';
  }
  h += '<table style="margin-top:8px"><tr><th>Test</th>'+liste.slice(-3).map(function(x){ return '<th class="num"><button class="link" data-tedit="'+esc(x.id)+'">'+deDatum(x.datum)+'</button></th>'; }).join('')+'</tr>';
  achsen.forEach(function(t){
    h += '<tr><td class="small">'+esc(t.kurz)+'</td>'+liste.slice(-3).map(function(x){ return '<td class="num small">'+testWert(t, x.werte[t.id])+'</td>'; }).join('')+'</tr>';
  });
  return h + '</table></div>';
}

function renderStatistik(){

  if (!liste.length){

    function vert(l){ var tot = l.reduce(function(a,e){return a+(e.rpe!=null&&e.sek?e.sek:0);},0);
      return { tot:tot, teile: bk.map(function(b){ return l.reduce(function(a,e){ return a+(e.rpe!=null&&e.sek&&e.rpe>=b[1]&&e.rpe<=b[2]?e.sek:0); },0); }) }; }

  var el = document.getElementById('t-statistik');
  el.innerHTML = h;
  el.querySelectorAll('[data-zr]').forEach(function(b){ b.onclick = function(){ save(K.zr, b.dataset.zr); renderStatistik(); }; });
  var uw = document.getElementById('uWahl'); if (uw) uw.onchange = function(){ save(K.uebung, uw.value); renderStatistik(); };
  el.querySelectorAll('[data-test]').forEach(function(b){ b.onclick = function(){ formTest(null); }; });
  el.querySelectorAll('[data-tedit]').forEach(function(b){ b.onclick = function(){ formTest(tests.filter(function(x){ return x.id===b.dataset.tedit; })[0]); }; });
}

/* ════════════════ Tab Daten ════════════════ */
function alleDaten(){
  return { version:4, exportiert:heute(), plaene:plaene, aktiv:aktivId, sessions:sessions, journal:journal,
    stufen:stufen, tests:tests,
    theorie: (window.Theorie ? Theorie.export() : null) };
}
function renderDaten(){
  var h = '<div class="card"><h3>Backup</h3>'+
    '<p class="small muted">Alles liegt lokal auf diesem Gerät. Der Export enthält Pläne, Journal, Krafteinheiten, Skill-Stufen, Tests und Theorie. Ein Backup aus Version 3 lässt sich hier einlesen.</p>'+
    '<div class="btns"><button class="btn prim" id="dEx">Exportieren</button>'+
    '<button class="btn" id="dImBtn">Importieren</button></div>'+
    '<input type="file" id="dIm" accept=".json,application/json" hidden></div>';
  h += '<div class="card"><h3>Plan importieren</h3>'+
    '<p class="small muted">Eine einzelne Plan-Datei (JSON) laden. So kommt der nächste Block rein, ohne dass an der App etwas geändert werden muss.</p>'+
    '<input type="file" id="pIm" accept=".json,application/json"></div>';
  h += '<div class="card"><h3>Pläne</h3><table>';
  plaene.forEach(function(p){
    h += '<tr><td>'+esc(p.name)+'<div class="tiny muted">'+esc(p.wettkampf ? p.wettkampf.datum : '')+'</div></td>'+
         '<td class="num">'+(p.id===aktivId?'<span class="tag on">aktiv</span>':'<button class="btn sm" data-akt="'+esc(p.id)+'">aktivieren</button>')+'</td>'+
         '<td class="num"><button class="btn sm" data-pdel="'+esc(p.id)+'" aria-label="Plan löschen">✕</button></td></tr>';
  });
  h += '</table></div>';
  var n = function(t){ return journal.filter(function(e){ return e.typ===t; }).length; };
  h += '<div class="card"><h3>Speicher</h3><table>'+
    '<tr><td>Journal: Läufe</td><td class="num">'+n('lauf')+'</td></tr>'+
    '<tr><td>Journal: Krafteinheiten</td><td class="num">'+n('kraft')+'</td></tr>'+
    '<tr><td>Journal: Beweglichkeit</td><td class="num">'+n('beweg')+'</td></tr>'+
    '<tr><td>Tests</td><td class="num">'+tests.length+'</td></tr>'+
    '<tr><td>Pläne</td><td class="num">'+plaene.length+'</td></tr>'+
    '<tr><td>Theorie-Themen</td><td class="num">'+(window.Theorie ? Theorie.themen().length : 0)+'</td></tr>'+
    '</table><p class="hint">Vor jedem Update der App ein Backup ziehen.</p></div>';
  var el = document.getElementById('t-daten');
  el.innerHTML = h;
  document.getElementById('dEx').onclick = function(){
    var blob = new Blob([JSON.stringify(alleDaten(), null, 2)], {type:'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'training-backup-' + heute() + '.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  document.getElementById('dImBtn').onclick = function(){ document.getElementById('dIm').click(); };
  document.getElementById('dIm').onchange = function(ev){
    dateiLesen(ev, function(d){
      if (d.plaene && d.plaene.length) plaene = d.plaene;
      if (d.aktiv) aktivId = d.aktiv;
      if (d.sessions && d.sessions.length && (d.version||0) >= 4) sessions = d.sessions;
      if (d.stufen) stufen = d.stufen;
      (d.tests||[]).forEach(function(t){ if (t && t.id && !tests.some(function(x){ return x.id===t.id; })) tests.push(t); });
      /* Saisonplan aus einem V3-Backup nicht über die neue Wochenstruktur legen */
      plaene = plaene.map(function(p){ return (p.id===PLAN_SAISON_2027.id && (p.version||0) < PLAN_SAISON_2027.version) ? PLAN_SAISON_2027 : p; });
      var rein = (d.journal || []).concat(ausAltdaten(d.runs || d.laeufe, d.kraftlog || d.logs));
      var neu = rein.filter(function(e){
        return e && e.datum && !journal.some(function(x){ return x.id===e.id ||
          (x.typ===e.typ && x.datum===e.datum && e.typ==='lauf' && Math.abs((x.km||0)-(e.km||0))<0.15); });
      });
      journal = journal.concat(neu);
      if (d.theorie && window.Theorie) Theorie.import(d.theorie);
      save(K.plaene, plaene); save(K.aktiv, aktivId); save(K.sessions, sessions); save(K.journal, journal);
      save(K.stufen, stufen); save(K.tests, tests);
      renderDaten(); renderKopf(); toast(neu.length + ' Einträge dazu');
    });
  };
  document.getElementById('pIm').onchange = function(ev){
    dateiLesen(ev, function(p){
      if (!p.id || !p.wochen){ toast('Keine gültige Plan-Datei'); return; }
      plaene = plaene.filter(function(x){ return x.id !== p.id; }).concat([p]); aktivId = p.id;
      save(K.plaene, plaene); save(K.aktiv, aktivId); renderDaten(); renderKopf(); toast('Plan «'+p.name+'» aktiv');
    });
  };
  el.querySelectorAll('[data-akt]').forEach(function(b){
    b.onclick = function(){ aktivId = b.dataset.akt; save(K.aktiv, aktivId); renderDaten(); renderKopf(); };
  });
  el.querySelectorAll('[data-pdel]').forEach(function(b){
    b.onclick = function(){
      if (plaene.length < 2){ toast('Der letzte Plan bleibt'); return; }
      plaene = plaene.filter(function(p){ return p.id !== b.dataset.pdel; });
      if (aktivId === b.dataset.pdel) aktivId = plaene[0].id;
      save(K.plaene, plaene); save(K.aktiv, aktivId); renderDaten(); renderKopf();
    };
  });
}
function dateiLesen(ev, cb){
  var f = ev.target.files && ev.target.files[0]; if (!f) return;
  var fr = new FileReader();
  fr.onload = function(){ try { cb(JSON.parse(String(fr.result))); } catch(e){ toast('Datei nicht lesbar'); } ev.target.value = ''; };
  fr.readAsText(f, 'utf-8');
}

/* ════════════════ Start ════════════════ */
renderKopf();
zeige(load(K.tab, 'heute'));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(function(){});

</script>
</body>
</html>
