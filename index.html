<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Training</title>
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{
  --bg:#0b0d12; --surface:#141822; --card:#1b2030; --line:#2a3044;
  --text:#e7ebf3; --muted:#8b94ad; --accent:#2fbf8f; --accent-dark:#1d8e69;
  --warn:#e0a33c; --bad:#e0645c;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:78px;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{padding:18px 16px 10px;max-width:720px;margin:0 auto}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-size:1.5rem;margin:2px 0 2px;font-weight:650}
.sub{color:var(--muted);font-size:.88rem;margin:0}
h2{font-size:1.15rem;margin:0 0 12px;font-weight:650}
h3{font-size:1rem;margin:0 0 6px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.now{border-color:var(--accent)}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.tiny{font-size:.76rem}
.tag{display:inline-block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.lauf{border-color:#2d5f8a;color:#8fc3f0}
.tag.kraft{border-color:#5e4a86;color:#c3aef5}
.tag.velo{border-color:#3f5a4a;color:#8fd6b4}
.tag.frei{border-color:var(--line)}
.tag.wk{border-color:var(--accent);color:var(--accent)}
.tag.on{background:var(--accent);color:#06251b;border-color:var(--accent)}
.day{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0}
.day .dw{flex:0 0 42px;color:var(--muted);font-size:.8rem;padding-top:2px}
.day.heute .dw{color:var(--accent);font-weight:700}
.day .tt{font-weight:600}
.check{margin-left:auto;flex:0 0 auto;color:var(--accent);font-size:1rem}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:transparent;border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:9px 13px;font-size:.88rem;cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:#06251b;font-weight:600}
.btn.sm{padding:6px 10px;font-size:.8rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px}
input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:10px;margin-bottom:10px}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:rgba(11,13,18,.96);
  border-top:1px solid var(--line);display:flex;z-index:20;
  padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:9px 2px 11px;
  font-size:.66rem;letter-spacing:.02em;cursor:pointer}
nav button .ic{display:block;font-size:1.15rem;line-height:1.3}
nav button.on{color:var(--accent)}
.bar{height:7px;background:var(--surface);border-radius:99px;overflow:hidden;margin-top:5px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar > i.over{background:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:.76rem;text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--accent);
  color:#06251b;padding:10px 16px;border-radius:99px;font-size:.86rem;font-weight:600;z-index:50;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.ue{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dotted var(--line)}
.ue input[type=checkbox]{width:19px;height:19px;flex:0 0 auto;margin:3px 0 0;accent-color:var(--accent)}
.hint{color:var(--muted);font-size:.84rem;margin-top:6px}
svg text{fill:var(--muted);font-size:9px}
.legende{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.legende span{font-size:.76rem;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:4px}
.gwahl{display:flex;gap:14px;min-width:max-content;padding-bottom:2px}
.gblock{flex:0 0 auto}
.glabel{font-size:.64rem;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.sbtn{background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:8px 12px;font-size:.85rem;font-weight:650;color:var(--text);cursor:pointer;min-width:46px}
.sbtn.on{background:var(--accent);border-color:var(--accent);color:#06251b}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem;margin-bottom:8px}
</style>
</head>
<body>

<header>
  <div class="eyebrow" id="hEyebrow">Training</div>
  <h1 id="hTitel">Training</h1>
  <p class="sub" id="hSub"></p>
</header>

<div class="wrap">
  <section id="t-plan"></section>
  <section id="t-laeufe" hidden></section>
  <section id="t-kraft" hidden></section>
  <section id="t-theorie" hidden></section>
  <section id="t-fortschritt" hidden></section>
  <section id="t-daten" hidden></section>
</div>

<nav>
  <button data-tab="plan"><span class="ic">▤</span>Plan</button>
  <button data-tab="laeufe"><span class="ic">▶</span>Läufe</button>
  <button data-tab="kraft"><span class="ic">▦</span>Kraft</button>
  <button data-tab="theorie"><span class="ic">✦</span>Theorie</button>
  <button data-tab="fortschritt"><span class="ic">◈</span>Fortschritt</button>
  <button data-tab="daten"><span class="ic">≡</span>Daten</button>
</nav>

<div class="toast" id="toast"></div>

<script src="./sessions.js"></script>
<script src="./theorie.js"></script>
<script>
/* ════════════════ Speicher ════════════════ */
var K = {
  plaene:'tp_plaene_v1', aktiv:'tp_plan_aktiv_v1', runs:'tp_runs_v1',
  kraftlog:'tp_kraftlog_v1', sessions:'tp_sessions_v1', tab:'tp_tab',
  sessver:'tp_sess_ver', asess:'tp_session_aktiv'
};
var ram = {};
function load(k, fb){
  try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; }
  catch(e){ return (k in ram) ? ram[k] : fb; }
}
function save(k, v){
  ram[k] = v;
  try { localStorage.setItem(k, JSON.stringify(v)); }
  catch(e){ toast('Speichern lokal blockiert'); }
}

/* ════════════════ Plan als Daten ════════════════
   Ein Plan ist reine Datenstruktur. Neue Vorbereitung = neue JSON-Datei
   importieren, kein Eingriff in den Code.
   { id, name, wettkampf:{name,datum,distanz}, ziel, tempi:{...},
     regeln:[...], wochen:[ {nr, start:'YYYY-MM-DD', fokus,
       tage:[ {typ:'lauf|kraft|velo|frei', titel, detail, km, session} × 7 ] } ] }
   tage[0] = Montag.
════════════════════════════════════════════════ */
var PLAN_HALLWILERSEE = {
  id: 'hallwilersee-2026',
  name: 'Hallwilerseelauf 2026 – Wiedereinstieg',
  wettkampf: { name: 'Hallwilerseelauf', datum: '2026-10-10', distanz: 21.1 },
  ziel: '2:28–2:32 · realistisch nach über einer Woche Ausfall',
  tempi: {
    'locker': '7:30–7:50',
    'Zieltempo': '6:55–7:05',
    'Schwelle': '6:20–6:30',
    'Wettkampf Start': '7:10'
  },
  regeln: [
    'Erste Woche ohne jede Intensität. Erst wenn zwei lockere Läufe problemlos sitzen, wird wieder hart gelaufen.',
    'Velo-Pendeln bleibt Zone 1. Das ist die Bedingung dafür, dass die Läufe Qualität haben.',
    'Ein ausgefallener Lauf wird nicht nachgeholt, sondern gestrichen.',
    'Letzte plyometrische Einheit: 30. September.'
  ],
  wochen: [
    { nr: 1, start: '2026-09-14', fokus: 'Zurückkommen, nichts beweisen',
      tage: [
        { typ:'kraft', titel:'Kraft B leicht', detail:'Oberkörper, keine Beine, 2 statt 3 Sätze', session:'kraft-b' },
        { typ:'lauf', titel:'Lockerer Lauf', detail:'30 Min bei 7:30–7:50, Sprechtest', km:4 },
        { typ:'velo', titel:'Velo-Pendeln', detail:'Zone 1' },
        { typ:'lauf', titel:'Lockerer Lauf', detail:'35 Min locker, letzte 5 Min zügiger', km:4.5 },
        { typ:'velo', titel:'Velo-Pendeln', detail:'Zone 1' },
        { typ:'lauf', titel:'Ruhiger langer Lauf', detail:'60–70 Min durchgehend locker, keine Tempoabschnitte', km:9 },
        { typ:'frei', titel:'Frei', detail:'' }
      ] },
    { nr: 2, start: '2026-09-21', fokus: 'Tempo wieder anfassen',
      tage: [
        { typ:'kraft', titel:'Kraft A mit Power', detail:'Power-Block nach dem Aufwärmen, dann Kraft', session:'kraft-a' },
        { typ:'velo', titel:'Velo-Pendeln', detail:'Zone 1' },
        { typ:'lauf', titel:'Qualität: 5 × 5 Min Zieltempo', detail:'6:55–7:05, je 2 Min traben; 12 Min ein- und auslaufen', km:11 },
        { typ:'velo', titel:'Velo-Pendeln', detail:'Zone 1' },
        { typ:'kraft', titel:'Kraft B', detail:'Oberkörper und OAP, keine Beine', session:'kraft-b' },
        { typ:'lauf', titel:'Langer Lauf 14 km', detail:'Locker, letzte 4 km im Zieltempo', km:14 },
        { typ:'frei', titel:'Frei', detail:'' }
      ] },
    { nr: 3, start: '2026-09-28', fokus: 'Generalprobe',
      tage: [
        { typ:'kraft', titel:'Kraft A mit Power', detail:'Letzte plyometrische Einheit am Mittwoch – heute normal', session:'kraft-a' },
        { typ:'velo', titel:'Velo-Pendeln', detail:'Zone 1' },
        { typ:'lauf', titel:'Qualität: 3 × 8 Min Schwelle', detail:'6:20–6:30, je 2:30 traben. Letzte Plyo-Einheit heute im Warm-up', km:11 },
        { typ:'velo', titel:'Velo-Pendeln', detail:'Zone 1' },
        { typ:'kraft', titel:'Kraft B', detail:'Oberkörper, keine Beine', session:'kraft-b' },
        { typ:'lauf', titel:'Generalprobe 17 km', detail:'Letzte 6 km im Zieltempo, Wettkampfschuhe, Gel bei km 7 und 13', km:17 },
        { typ:'frei', titel:'Frei', detail:'' }
      ] },
    { nr: 4, start: '2026-10-05', fokus: 'Tapering – Umfang runter, Intensität kurz halten',
      tage: [
        { typ:'kraft', titel:'Kraft B kurz', detail:'Nur Oberkörper, 2 Sätze, kein Muskelversagen', session:'kraft-b' },
        { typ:'lauf', titel:'Lockerer Lauf mit Tempoabschnitten', detail:'30 Min locker mit 3 × 3 Min im Zieltempo', km:5 },
        { typ:'velo', titel:'Velo-Pendeln', detail:'Zone 1' },
        { typ:'lauf', titel:'Kurz und locker', detail:'20 Min plus 4 Steigerungsläufe à 20 s', km:3.5 },
        { typ:'frei', titel:'Frei – Beine hoch', detail:'Kohlenhydrate hochfahren, früh ins Bett' },
        { typ:'lauf', titel:'Hallwilerseelauf', detail:'km 0–5 bei 7:10 · km 5–15 bei 7:00 · Gel km 7 und 13 · ab km 15 Rest geben', km:21.1 },
        { typ:'frei', titel:'Frei', detail:'' }
      ] }
  ]
};

var SESSIONS_VERSION = 3;
var DEFAULT_SESSIONS = window.DEFAULT_SESSIONS || [];

/* ════════════════ Zustand ════════════════ */
var plaene = load(K.plaene, null);
if (!plaene || !plaene.length) { plaene = [PLAN_HALLWILERSEE]; save(K.plaene, plaene); }
var aktivId = load(K.aktiv, plaene[0].id);
var runs = load(K.runs, []);
var kraftlog = load(K.kraftlog, []);
var sessions = load(K.sessions, null);
if (!sessions || !sessions.length || load(K.sessver, 0) !== SESSIONS_VERSION){
  sessions = DEFAULT_SESSIONS; save(K.sessions, sessions); save(K.sessver, SESSIONS_VERSION);
}
var aktivSession = load(K.asess, sessions.length ? sessions[0].id : null);

function plan(){ return plaene.filter(function(p){return p.id===aktivId;})[0] || plaene[0]; }

/* ════════════════ Hilfen ════════════════ */
var WT = ['Mo','Di','Mi','Do','Fr','Sa','So'];
function iso(d){ return d.toISOString().slice(0,10); }
function heute(){ return iso(new Date()); }
function plusTage(isoStr, n){ var d = new Date(isoStr+'T12:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function deDatum(isoStr){ var p = String(isoStr).split('-'); return p.length===3 ? p[2]+'.'+p[1]+'.' : isoStr; }
function tageBis(isoStr){
  return Math.round((new Date(isoStr+'T12:00:00') - new Date(heute()+'T12:00:00'))/86400000);
}
function paceStr(sek, km){
  if (!sek || !km) return '–';
  var p = sek/km, m = Math.floor(p/60), s = Math.round(p%60);
  if (s===60){ m++; s=0; }
  return m+':'+String(s).padStart(2,'0');
}
function zeitStr(sek){
  if (!sek) return '–';
  var h = Math.floor(sek/3600), m = Math.floor((sek%3600)/60), s = Math.round(sek%60);
  return h ? h+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')
           : m+':'+String(s).padStart(2,'0');
}
function parseZeit(txt){
  if (!txt) return 0;
  var p = String(txt).trim().split(':').map(function(x){ return parseFloat(x.replace(',','.'))||0; });
  if (p.length===3) return p[0]*3600+p[1]*60+p[2];
  if (p.length===2) return p[0]*60+p[1];
  return p[0]*60;
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var toastTimer;
function toast(txt){
  var t = document.getElementById('toast');
  t.textContent = txt; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

/* ════════════════ Navigation ════════════════ */
var TABS = ['plan','laeufe','kraft','theorie','fortschritt','daten'];
function zeige(tab){
  TABS.forEach(function(t){ document.getElementById('t-'+t).hidden = (t!==tab); });
  document.querySelectorAll('nav button').forEach(function(b){
    b.classList.toggle('on', b.dataset.tab===tab); });
  save(K.tab, tab);
  if (tab==='plan') renderPlan();
  if (tab==='laeufe') renderLaeufe();
  if (tab==='kraft') renderKraft();
  if (tab==='theorie' && window.Theorie) Theorie.mount('t-theorie');
  if (tab==='fortschritt') renderFortschritt();
  if (tab==='daten') renderDaten();
  window.scrollTo(0,0);
}
document.querySelectorAll('nav button').forEach(function(b){
  b.onclick = function(){ zeige(b.dataset.tab); };
});

/* ════════════════ Kopf ════════════════ */
function renderKopf(){
  var p = plan(), d = tageBis(p.wettkampf.datum);
  document.getElementById('hEyebrow').textContent =
    p.wettkampf.name + ' · ' + deDatum(p.wettkampf.datum) + String(p.wettkampf.datum).slice(0,4);
  document.getElementById('hTitel').textContent =
    d > 0 ? 'Noch ' + d + ' Tage' : (d === 0 ? 'Heute ist Wettkampf' : 'Wettkampf vorbei');
  document.getElementById('hSub').textContent = p.ziel || '';
}

/* ════════════════ Tab Plan ════════════════ */
function erledigtAm(datum, typ){
  if (typ==='lauf') return runs.some(function(r){ return r.datum===datum; });
  if (typ==='kraft') return kraftlog.some(function(l){ return l.datum===datum; });
  return false;
}
function renderPlan(){
  var p = plan(), h = '';

  if (plaene.length > 1){
    h += '<div class="card"><label>Aktiver Plan</label><select id="planWahl" style="margin:0">';
    plaene.forEach(function(x){
      h += '<option value="'+esc(x.id)+'"'+(x.id===p.id?' selected':'')+'>'+esc(x.name)+'</option>';
    });
    h += '</select></div>';
  }

  h += '<div class="card"><div class="between"><h3>Tempi</h3><span class="tiny muted">min/km</span></div><table>';
  Object.keys(p.tempi || {}).forEach(function(k){
    h += '<tr><td>'+esc(k)+'</td><td class="num">'+esc(p.tempi[k])+'</td></tr>';
  });
  h += '</table></div>';

  (p.wochen || []).forEach(function(w){
    var ende = plusTage(w.start, 6);
    var jetzt = heute() >= w.start && heute() <= ende;
    h += '<div class="card'+(jetzt?' now':'')+'">';
    h += '<div class="between"><h3>Woche '+w.nr+(jetzt?' · jetzt':'')+'</h3>'+
         '<span class="tiny muted">'+deDatum(w.start)+'–'+deDatum(ende)+'</span></div>';
    if (w.fokus) h += '<p class="small muted" style="margin:0 0 8px">'+esc(w.fokus)+'</p>';
    (w.tage || []).forEach(function(t, i){
      var datum = plusTage(w.start, i);
      var ist = datum === heute();
      var ok = erledigtAm(datum, t.typ);
      var wk = t.km && t.km > 20;
      h += '<div class="day'+(ist?' heute':'')+'">';
      h += '<div class="dw">'+WT[i]+' '+deDatum(datum).slice(0,3)+'</div><div style="flex:1">';
      h += '<div class="tt">'+esc(t.titel)+' <span class="tag '+(wk?'wk':t.typ)+'">'+
           (wk?'Wettkampf':t.typ)+'</span></div>';
      if (t.detail) h += '<div class="small muted">'+esc(t.detail)+'</div>';
      if (t.km) h += '<div class="tiny muted">ca. '+t.km+' km</div>';
      if (t.session) h += '<button class="btn sm" style="margin-top:6px" data-open="'+esc(t.session)+'">Einheit öffnen</button>';
      h += '</div>';
      if (ok) h += '<div class="check">✓</div>';
      h += '</div>';
    });
    h += '</div>';
  });

  if (p.regeln && p.regeln.length){
    h += '<div class="card"><h3>Regeln</h3><ul class="small" style="margin:0;padding-left:1.1em">';
    p.regeln.forEach(function(r){ h += '<li style="margin-bottom:5px">'+esc(r)+'</li>'; });
    h += '</ul></div>';
  }

  document.getElementById('t-plan').innerHTML = h;
  document.getElementById('t-plan').querySelectorAll('[data-open]').forEach(function(b){
    b.onclick = function(ev){ ev.stopPropagation(); oeffneSession(b.dataset.open); };
  });
  var sel = document.getElementById('planWahl');
  if (sel) sel.onchange = function(){ aktivId = sel.value; save(K.aktiv, aktivId); renderKopf(); renderPlan(); };
  renderKopf();
}

/* ════════════════ Tab Läufe ════════════════ */
function renderLaeufe(){
  var h = '<div class="card"><h2>Lauf eintragen</h2>';
  h += '<div class="grid2"><div><label>Datum</label><input type="date" id="rD" value="'+heute()+'"></div>';
  h += '<div><label>Art</label><select id="rA"><option value="locker">locker</option>'+
       '<option value="qualitaet">Qualität</option><option value="long">langer Lauf</option>'+
       '<option value="wettkampf">Wettkampf</option></select></div></div>';
  h += '<div class="grid3"><div><label>km</label><input type="text" inputmode="decimal" id="rK" placeholder="10.2"></div>';
  h += '<div><label>Zeit</label><input type="text" id="rZ" placeholder="1:05:30"></div>';
  h += '<div><label>Ø Puls</label><input type="text" inputmode="numeric" id="rP" placeholder="142"></div></div>';
  h += '<label>Notiz</label><input type="text" id="rN" placeholder="Gefühl, Wetter, Abbruchgrund">';
  h += '<div class="btns"><button class="btn prim" id="rAdd">Eintragen</button></div></div>';

  h += '<div class="card"><h3>Garmin-CSV importieren</h3>'+
       '<p class="small muted">Garmin Connect → Aktivitäten → Alle Aktivitäten → CSV exportieren. '+
       'Velo-Aktivitäten und Duplikate werden übersprungen.</p>'+
       '<input type="file" id="rCsv" accept=".csv,text/csv"></div>';

  h += '<div class="card"><div class="between"><h3>Läufe</h3><span class="tiny muted">'+runs.length+' Einträge</span></div>';
  if (!runs.length) h += '<p class="small muted">Noch nichts eingetragen.</p>';
  else {
    h += '<table><tr><th>Datum</th><th>Art</th><th class="num">km</th><th class="num">Zeit</th>'+

function laufSpeichern(){
  var km = parseFloat(String(document.getElementById('rK').value).replace(',','.'));

    notiz:document.getElementById('rN').value.trim() });

}

/* Garmin-CSV: deutsches Format, Komma als Dezimaltrenner, Punkt als Tausender, «--» leer */
function csvZeilen(text){
  var zeilen = [], feld = '', reihe = [], inQ = false;
  for (var i=0; i<text.length; i++){
    var c = text[i];
    if (inQ){
      if (c === '"' && text[i+1] === '"'){ feld += '"'; i++; }
      else if (c === '"') inQ = false;
      else feld += c;
    } else if (c === '"') inQ = true;
    else if (c === ','){ reihe.push(feld); feld = ''; }
    else if (c === '\n'){ reihe.push(feld); zeilen.push(reihe); reihe = []; feld = ''; }
    else if (c !== '\r') feld += c;
  }
  if (feld.length || reihe.length){ reihe.push(feld); zeilen.push(reihe); }
  return zeilen.filter(function(r){ return r.some(function(x){ return String(x).trim(); }); });
}
function zahlDE(txt){
  if (txt == null) return 0;
  var s = String(txt).trim();
  if (!s || s === '--') return 0;
  return parseFloat(s.replace(/\./g,'').replace(',','.')) || 0;
}
function spalte(kopf, fragmente){
  for (var i=0; i<kopf.length; i++){
    var k = kopf[i].toLowerCase();
    for (var j=0; j<fragmente.length; j++) if (k.indexOf(fragmente[j]) >= 0) return i;
  }
  return -1;
}
function garminParsen(text){
  var z = csvZeilen(text);
  if (z.length < 2) return { neu:[], uebersprungen:0 };
  var kopf = z[0];
  var iTyp = spalte(kopf, ['aktivitätstyp','activity type','typ']);
  var iDat = spalte(kopf, ['datum','date']);
  var iKm  = spalte(kopf, ['distanz','distance']);
  var iZeit= spalte(kopf, ['zeit','time','dauer']);
  var iHf  = spalte(kopf, ['ø hf','ø herzfrequenz','durchschn. hf','avg hr','herzfrequenz']);
  var neu = [], skip = 0;
  z.slice(1).forEach(function(r){
    var typ = (iTyp>=0 ? r[iTyp] : '').toLowerCase();
    if (/rad|velo|cycl|bike|schwimm|swim|gehen|walk/.test(typ)){ skip++; return; }
    var roh = iDat>=0 ? String(r[iDat]).trim() : '';
    var m = roh.match(/(\d{4})-(\d{2})-(\d{2})/) ||
            roh.match(/(\d{2})\.(\d{2})\.(\d{4})/);
    var datum = null;
    if (m) datum = m[1].length === 4 ? m[1]+'-'+m[2]+'-'+m[3] : m[3]+'-'+m[2]+'-'+m[1];
    var km = zahlDE(iKm>=0 ? r[iKm] : 0);
    var zeit = parseZeit(iZeit>=0 ? r[iZeit] : '');
    if (!datum || !km || !zeit){ skip++; return; }
    var doppelt = runs.concat(neu).some(function(x){
      return x.datum===datum && Math.abs(x.km-km) < 0.15; });
    if (doppelt){ skip++; return; }
    var wt = new Date(datum+'T12:00:00').getDay();
    neu.push({ id:uid(), datum:datum, km:km, zeit:zeit,
      hf: iHf>=0 ? (parseInt(zahlDE(r[iHf]),10) || null) : null,
      art: km >= 13 ? 'long' : (wt===3 ? 'qualitaet' : 'locker'),
      notiz:'aus Garmin' });
  });
  return { neu:neu, uebersprungen:skip };
}
function csvImport(ev){
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    var res = garminParsen(String(fr.result));
    runs = runs.concat(res.neu);
    save(K.runs, runs); renderLaeufe();
    toast(res.neu.length + ' importiert, ' + res.uebersprungen + ' übersprungen');
  };
  fr.readAsText(f, 'utf-8');
}

/* ════════════════ Tab Kraft ════════════════ */
function renderKraft(){
  var el = document.getElementById('t-kraft');
  if (!sessions.length){ el.innerHTML = '<div class="card">Keine Einheiten hinterlegt.</div>'; return; }
  var s = sessions.filter(function(x){ return x.id===aktivSession; })[0] || sessions[0];
  aktivSession = s.id;

  // Wahlleiste, nach Gruppe sortiert
  var gruppen = [];
  sessions.forEach(function(x){
    var g = gruppen.filter(function(y){ return y.name === (x.gruppe||'Übrige'); })[0];
    if (!g){ g = { name:x.gruppe||'Übrige', items:[] }; gruppen.push(g); }
    g.items.push(x);
  });
  var h = '<div class="card"><div style="overflow-x:auto"><div class="gwahl">';
  gruppen.forEach(function(g){
    h += '<div class="gblock"><div class="glabel">'+esc(g.name)+'</div><div class="row" style="gap:5px">';
    g.items.forEach(function(x){
      h += '<button class="sbtn'+(x.id===s.id?' on':'')+'" data-sess="'+esc(x.id)+'">'+esc(x.name)+'</button>';
    });
    h += '</div></div>';
  });
  h += '</div></div></div>';

  // Detail
  h += '<div class="card"><div class="between"><h3>'+esc(s.name)+'</h3>'+
       (s.dauer ? '<span class="tiny muted">'+esc(s.dauer)+'</span>' : '')+'</div>';
  if (s.untertitel) h += '<p class="small muted" style="margin:0">'+esc(s.untertitel)+'</p>';
  var meta = '';
  if (s.fokus) meta += '<tr><td class="muted">Fokus</td><td>'+esc(s.fokus)+'</td></tr>';
  if (s.equipment) meta += '<tr><td class="muted">Material</td><td>'+esc(s.equipment)+'</td></tr>';
  if (s.warmup) meta += '<tr><td class="muted">Aufwärmen</td><td>'+esc(s.warmup)+'</td></tr>';
  if (s.pause) meta += '<tr><td class="muted">Pause</td><td>'+esc(s.pause)+'</td></tr>';
  if (meta) h += '<details style="margin-top:8px"><summary>Details</summary><table>'+meta+'</table></details>';

  var letzterTag = '';
  (s.uebungen||[]).forEach(function(u){
    if (u.tag && u.tag !== letzterTag){
      h += '<div style="margin-top:10px"><strong class="small">'+esc(u.tag)+'</strong></div>';
      letzterTag = u.tag;
    }
    h += '<div class="ue"><input type="checkbox" data-ue="'+esc(u.id)+'"><div>'+
         '<div style="font-weight:600">'+esc(u.name)+'</div>'+
         '<div class="small">'+esc(u.dosis)+'</div>'+
         (u.cue ? '<div class="tiny muted">'+esc(u.cue)+'</div>' : '')+
         (u.schulter ? '<div class="tiny" style="color:var(--warn)">'+esc(u.schulter)+'</div>' : '')+
         '</div></div>';
  });
  if (s.finisher) h += '<p class="hint"><strong>Finisher:</strong> '+esc(s.finisher)+'</p>';
  h += '<input type="text" id="kNote" placeholder="Notiz (Gewichte, Schmerz, Gefühl)" style="margin-top:10px">';
  h += '<div class="btns"><button class="btn prim" id="kSave">Einheit eintragen</button></div></div>';

  // Log
  h += '<div class="card"><h3>Kraft-Log</h3>';
  if (!kraftlog.length) h += '<p class="small muted">Noch nichts eingetragen.</p>';
  else {
    h += '<table><tr><th>Datum</th><th>Einheit</th><th class="num">erledigt</th><th></th></tr>';
    kraftlog.slice().sort(function(a,b){ return a.datum < b.datum ? 1 : -1; }).slice(0,25).forEach(function(l){
      h += '<tr><td>'+deDatum(l.datum)+'</td><td>'+esc(l.name)+'</td>'+
           '<td class="num">'+l.erledigt+'/'+l.total+'</td>'+
           '<td class="num"><button class="btn sm" data-kdel="'+l.id+'">✕</button></td></tr>';
      if (l.notiz) h += '<tr><td colspan="4" class="tiny muted" style="border:0;padding-top:0">'+esc(l.notiz)+'</td></tr>';
    });
    h += '</table>';
  }
  h += '</div>';

  el.innerHTML = h;
  el.querySelectorAll('[data-sess]').forEach(function(b){
    b.onclick = function(){ aktivSession = b.dataset.sess; save(K.asess, aktivSession); renderKraft(); };
  });
  document.getElementById('kSave').onclick = function(){
    var cbs = el.querySelectorAll('input[data-ue]');
    var erledigt = 0;
    cbs.forEach(function(c){ if (c.checked) erledigt++; });
    if (!erledigt){ toast('Nichts angehakt'); return; }
    kraftlog.push({ id:uid(), datum:heute(), session:s.id, name:s.name,
      erledigt:erledigt, total:cbs.length, notiz:document.getElementById('kNote').value.trim() });
    save(K.kraftlog, kraftlog); renderKraft(); toast('Eingetragen');
  };
  el.querySelectorAll('[data-kdel]').forEach(function(b){
    b.onclick = function(){
      kraftlog = kraftlog.filter(function(l){ return l.id !== b.dataset.kdel; });
      save(K.kraftlog, kraftlog); renderKraft(); toast('Gelöscht');
    };
  });
}
function oeffneSession(id){
  if (!sessions.some(function(x){ return x.id===id; })) return;
  aktivSession = id; save(K.asess, id); zeige('kraft');
}

/* ════════════════ Tab Fortschritt ════════════════ */
function wochenBilanz(){
  var p = plan();
  return (p.wochen || []).map(function(w){
    var ende = plusTage(w.start, 6);
    var soll = (w.tage || []).reduce(function(n,t){ return n + (t.km||0); }, 0);
    var ist = runs.filter(function(r){ return r.datum >= w.start && r.datum <= ende; })
                  .reduce(function(n,r){ return n + (r.km||0); }, 0);
    var geplant = (w.tage||[]).filter(function(t){ return t.typ==='lauf'||t.typ==='kraft'; }).length;
    var gemacht = 0;
    for (var i=0;i<7;i++){
      var d = plusTage(w.start,i), t = (w.tage||[])[i];
      if (t && (t.typ==='lauf'||t.typ==='kraft') && erledigtAm(d, t.typ)) gemacht++;
    }
    return { nr:w.nr, start:w.start, soll:soll, ist:ist, geplant:geplant, gemacht:gemacht };
  });
}
function sparkline(werte, labels, invers){
  if (werte.length < 2) return '<p class="small muted">Zu wenige Daten für einen Trend.</p>';
  var w = 320, hh = 90, pad = 6;
  var min = Math.min.apply(null, werte), max = Math.max.apply(null, werte);
  if (max === min){ max = min + 1; }
  var pts = werte.map(function(v,i){
    var x = pad + i*(w-2*pad)/(werte.length-1);
    var rel = (v-min)/(max-min);
    var y = invers ? pad + rel*(hh-2*pad) : hh - pad - rel*(hh-2*pad);
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var s = '<svg viewBox="0 0 '+w+' '+hh+'" width="100%" height="'+hh+'">';
  s += '<polyline fill="none" stroke="#2fbf8f" stroke-width="2" points="'+pts.join(' ')+'"/>';
  pts.forEach(function(p){ var xy = p.split(','); s += '<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="2.5" fill="#2fbf8f"/>'; });
  s += '<text x="'+pad+'" y="'+(hh-1)+'">'+esc(labels[0])+'</text>';
  s += '<text x="'+(w-pad)+'" y="'+(hh-1)+'" text-anchor="end">'+esc(labels[labels.length-1])+'</text>';
  s += '</svg>';
  return s;
}
function renderFortschritt(){
  var h = '', b = wochenBilanz();

  h += '<div class="card"><h3>Kilometer pro Woche</h3>';
  b.forEach(function(x){
    var pct = x.soll ? Math.min(100, x.ist/x.soll*100) : 0;
    h += '<div style="margin-bottom:10px"><div class="between small"><span>Woche '+x.nr+'</span>'+
         '<span class="muted">'+x.ist.toFixed(1)+' / '+x.soll.toFixed(0)+' km</span></div>'+
         '<div class="bar"><i style="width:'+pct.toFixed(0)+'%"></i></div></div>';
  });
  h += '</div>';

  h += '<div class="card"><h3>Einheiten erfüllt</h3>';
  b.forEach(function(x){
    var pct = x.geplant ? x.gemacht/x.geplant*100 : 0;
    h += '<div style="margin-bottom:10px"><div class="between small"><span>Woche '+x.nr+'</span>'+
         '<span class="muted">'+x.gemacht+' / '+x.geplant+'</span></div>'+
         '<div class="bar"><i style="width:'+pct.toFixed(0)+'%"></i></div></div>';
  });
  h += '</div>';

  var sortiert = runs.slice().sort(function(a,b2){ return a.datum < b2.datum ? -1 : 1; });
  var locker = sortiert.filter(function(r){ return r.art==='locker'||r.art==='long'; });
  h += '<div class="card"><h3>Pace lockere und lange Läufe</h3>';
  h += sparkline(locker.map(function(r){ return r.zeit/r.km; }),
                 locker.map(function(r){ return deDatum(r.datum); }), true);
  h += '<p class="hint">Höher heisst schneller. Beim langen Lauf zählt die Pace nur zusammen mit dem Puls.</p></div>';

  var mitHf = sortiert.filter(function(r){ return r.hf && r.km && r.zeit; });
  h += '<div class="card"><h3>Effizienz: Meter pro Herzschlag</h3>';
  h += sparkline(mitHf.map(function(r){ return r.km*1000/(r.hf*r.zeit/60); }),
                 mitHf.map(function(r){ return deDatum(r.datum); }), false);
  h += '<p class="hint">Distanz geteilt durch die Zahl der Herzschläge. Steigt der Wert, läufst du beim gleichen Puls schneller.</p></div>';

  var gesamt = runs.reduce(function(n,r){ return n+(r.km||0); },0);
  h += '<div class="card"><h3>Total</h3><table>'+
       '<tr><td>Läufe erfasst</td><td class="num">'+runs.length+'</td></tr>'+
       '<tr><td>Kilometer gesamt</td><td class="num">'+gesamt.toFixed(1)+'</td></tr>'+
       '<tr><td>Krafteinheiten</td><td class="num">'+kraftlog.length+'</td></tr>'+
       '</table></div>';

  document.getElementById('t-fortschritt').innerHTML = h;
}

/* ════════════════ Tab Daten ════════════════ */
function alleDaten(){
  return { version:2, exportiert:heute(), plaene:plaene, aktiv:aktivId,
    runs:runs, kraftlog:kraftlog, sessions:sessions,
    theorie: (window.Theorie ? Theorie.export() : null) };
}
function renderDaten(){
  var h = '<div class="card"><h3>Backup</h3>'+
    '<p class="small muted">Alles liegt lokal auf diesem Gerät. Der Export enthält Pläne, Läufe, Kraft-Log und Theorie-Themen.</p>'+
    '<div class="btns"><button class="btn prim" id="dEx">Exportieren</button>'+
    '<button class="btn" id="dImBtn">Importieren</button></div>'+
    '<input type="file" id="dIm" accept=".json,application/json" hidden></div>';

  h += '<div class="card"><h3>Plan importieren</h3>'+
    '<p class="small muted">Eine einzelne Plan-Datei (JSON) laden – so kommt die nächste Vorbereitung rein, '+
    'ohne dass an der App etwas geändert werden muss.</p>'+
    '<input type="file" id="pIm" accept=".json,application/json"></div>';

  h += '<div class="card"><h3>Pläne</h3><table>';
  plaene.forEach(function(p){
    h += '<tr><td>'+esc(p.name)+'<div class="tiny muted">'+esc(p.wettkampf ? p.wettkampf.datum : '')+'</div></td>'+
         '<td class="num">'+(p.id===aktivId?'<span class="tag on">aktiv</span>':
           '<button class="btn sm" data-akt="'+esc(p.id)+'">aktivieren</button>')+'</td>'+
         '<td class="num"><button class="btn sm" data-pdel="'+esc(p.id)+'">✕</button></td></tr>';
  });
  h += '</table></div>';

  h += '<div class="card"><h3>Speicher</h3><table>'+
    '<tr><td>Läufe</td><td class="num">'+runs.length+'</td></tr>'+
    '<tr><td>Krafteinheiten</td><td class="num">'+kraftlog.length+'</td></tr>'+
    '<tr><td>Pläne</td><td class="num">'+plaene.length+'</td></tr>'+
    '<tr><td>Theorie-Themen</td><td class="num">'+(window.Theorie ? Theorie.themen().length : 0)+'</td></tr>'+
    '</table><p class="hint">Vor jedem Update der App ein Backup ziehen.</p></div>';

  var el = document.getElementById('t-daten');
  el.innerHTML = h;

  document.getElementById('dEx').onclick = function(){
    var blob = new Blob([JSON.stringify(alleDaten(), null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'training-backup-' + heute() + '.json';
    a.click(); URL.revokeObjectURL(a.href);
  };
  document.getElementById('dImBtn').onclick = function(){ document.getElementById('dIm').click(); };
  document.getElementById('dIm').onchange = function(ev){
    dateiLesen(ev, function(d){
      if (d.plaene && d.plaene.length) plaene = d.plaene;
      if (d.aktiv) aktivId = d.aktiv;
      if (d.sessions && d.sessions.length) sessions = d.sessions;
      // Läufe und Log zusammenführen statt ersetzen
      var neueRuns = (d.runs || d.laeufe || []).filter(function(r){
        return r && r.datum && !runs.some(function(x){ return x.datum===r.datum && Math.abs((x.km||0)-(r.km||0))<0.15; });
      }).map(function(r){ r.id = r.id || uid(); return r; });
      runs = runs.concat(neueRuns);
      var neueLogs = (d.kraftlog || d.logs || []).filter(function(l){
        return l && l.datum && !kraftlog.some(function(x){ return x.id===l.id; });
      }).map(function(l){ l.id = l.id || uid(); return l; });
      kraftlog = kraftlog.concat(neueLogs);
      if (d.theorie && window.Theorie) Theorie.import(d.theorie);
      save(K.plaene, plaene); save(K.aktiv, aktivId); save(K.sessions, sessions);
      save(K.runs, runs); save(K.kraftlog, kraftlog);
      renderDaten(); renderKopf();
      toast(neueRuns.length + ' Läufe, ' + neueLogs.length + ' Einheiten dazu');
    });
  };
  document.getElementById('pIm').onchange = function(ev){
    dateiLesen(ev, function(p){
      if (!p.id || !p.wochen){ toast('Keine gültige Plan-Datei'); return; }
      plaene = plaene.filter(function(x){ return x.id !== p.id; }).concat([p]);
      aktivId = p.id;
      save(K.plaene, plaene); save(K.aktiv, aktivId);
      renderDaten(); renderKopf(); toast('Plan «'+p.name+'» aktiv');
    });
  };
  el.querySelectorAll('[data-akt]').forEach(function(b){
    b.onclick = function(){ aktivId = b.dataset.akt; save(K.aktiv, aktivId); renderDaten(); renderKopf(); };
  });
  el.querySelectorAll('[data-pdel]').forEach(function(b){
    b.onclick = function(){
      if (plaene.length < 2){ toast('Der letzte Plan bleibt'); return; }
      plaene = plaene.filter(function(p){ return p.id !== b.dataset.pdel; });
      if (aktivId === b.dataset.pdel) aktivId = plaene[0].id;
      save(K.plaene, plaene); save(K.aktiv, aktivId); renderDaten(); renderKopf();
    };
  });
}
function dateiLesen(ev, cb){
  var f = ev.target.files && ev.target.files[0];
  if (!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try { cb(JSON.parse(String(fr.result))); }
    catch(e){ toast('Datei nicht lesbar'); }
    ev.target.value = '';
  };
  fr.readAsText(f, 'utf-8');
}

zeige(load(K.tab, 'plan'));
